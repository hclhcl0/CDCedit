name: Build CDCedit EXE and APK

on:
  workflow_dispatch:
    inputs:
      target:
        description: Platforms to build
        type: choice
        options: [both, windows, android]
        default: both

permissions:
  contents: read
  actions: read

concurrency:
  group: cdcedit-windows-android-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Check bundled assets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/ci/check-bundled-assets.py

  windows:
    if: ${{ inputs.target != 'android' }}
    name: Windows EXE
    needs: validate
    uses: ./.github/workflows/build-app.yml
    with:
      ref: ${{ github.sha }}
      windows_only: true
    secrets: inherit

  android:
    if: ${{ inputs.target != 'windows' }}
    name: Android APK
    needs: validate
    uses: ./.github/workflows/mobile.yml
    with:
      ref: ${{ github.sha }}
      android_only: true
    secrets: inherit
