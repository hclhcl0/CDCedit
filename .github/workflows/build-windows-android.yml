name: Build CDCedit EXE and APK

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      windows:
        description: Also build Windows EXE
        type: boolean
        default: true

permissions:
  contents: write
  actions: read

concurrency:
  group: cdcedit-build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  GGML_NATIVE: "OFF"

jobs:
  validate:
    name: Check bundled assets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/ci/check-bundled-assets.py

  android-arm64:
    name: Android arm64 APK
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      CARGO_PROFILE_RELEASE_LTO: "false"
      CARGO_PROFILE_RELEASE_CODEGEN_UNITS: "4"
      CARGO_PROFILE_RELEASE_PACKAGE_CONCAT_CODEGEN_UNITS: "4"
      CARGO_BUILD_JOBS: "2"
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/share/boost /opt/ghc /usr/local/share/powershell 2>/dev/null || true
          df -h

      - name: Set up swap space
        run: |
          sudo systemctl stop systemd-oomd 2>/dev/null || true
          sudo systemctl disable systemd-oomd 2>/dev/null || true
          sudo sysctl vm.swappiness=100 || true
          sudo fallocate -l 10G /swapfile2 || sudo dd if=/dev/zero of=/swapfile2 bs=1M count=10240
          sudo chmod 600 /swapfile2
          sudo mkswap /swapfile2
          sudo swapon /swapfile2
          free -h

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Read the version
        id: version
        run: |
          version=$(sed -n 's/^version = "\(.*\)"/\1/p' src/Cargo.toml | head -1)
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Building CDCedit $version for aarch64-linux-android"

      - name: The pinned toolchain
        id: toolchain
        run: echo "channel=$(sed -n 's/^channel = "\(.*\)"/\1/p' src/rust-toolchain.toml)" >> "$GITHUB_OUTPUT"

      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8
        with:
          toolchain: ${{ steps.toolchain.outputs.channel }}
          targets: aarch64-linux-android

      - uses: taiki-e/cache-cargo-install-action@9ee83daaa7b96a6fab930949ecf1122bba04a389
        with:
          tool: cargo-apk

      - name: System libraries
        run: sudo apt-get update && sudo apt-get install -y cmake libclang-dev

      - name: FFmpeg for Android (cached)
        id: ffmpeg
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: src/vendor/ffmpeg/aarch64-linux-android
          key: ffmpeg-aarch64-linux-android-${{ hashFiles('src/scripts/ffmpeg-mobile.sh') }}

      - name: FFmpeg for Android
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        run: src/scripts/ffmpeg-mobile.sh aarch64-linux-android

      - name: FFmpeg for Android (save)
        if: steps.ffmpeg.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: src/vendor/ffmpeg/aarch64-linux-android
          key: ${{ steps.ffmpeg.outputs.cache-primary-key }}

      - name: sherpa-onnx for Android
        run: src/scripts/sherpa-mobile.sh aarch64-linux-android

      - name: youtubedl-android and tools for Android
        run: |
          chmod +x src/scripts/ytdlp-mobile.sh
          src/scripts/ytdlp-mobile.sh aarch64-linux-android

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6
        with:
          workspaces: src
          cache-on-failure: true
          key: aarch64-linux-android

      - name: A key for the run
        run: |
          set -euo pipefail
          keystore=$RUNNER_TEMP/run.keystore
          keytool -genkeypair -v -keystore "$keystore" -storepass concat -keypass concat \
            -alias concat -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=CDCedit, O=CDCedit" >/dev/null 2>&1
          echo "CARGO_APK_RELEASE_KEYSTORE=$keystore" >> "$GITHUB_ENV"
          echo "CARGO_APK_RELEASE_KEYSTORE_PASSWORD=concat" >> "$GITHUB_ENV"

      - name: Build the APK
        working-directory: src
        run: |
          set -o pipefail
          eval "$(scripts/mobile-env.sh aarch64-linux-android)"
          cargo apk build --release -p concat-android --target aarch64-linux-android 2>&1 | tee build.log

      - name: Every library is aligned for 16 KB pages
        run: python3 scripts/ci/check-16k-pages.py src/target/release/apk/CDCedit.apk

      - name: Build log to the summary (failure only)
        if: always()
        run: |
          if [ -f src/build.log ]; then
            PASTE_URL=$(curl -s -F "content=<-" https://dpaste.org/api/ < src/build.log | tr -d '"') || true
            echo "::error title=BuildLog::$PASTE_URL"
            {
              echo "### Build status: Android arm64"
              echo "Log URL: $PASTE_URL"
              echo '```'
              tail -n 150 src/build.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Stage
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          mkdir stage
          cp src/target/release/apk/CDCedit.apk "stage/CDCedit-$VERSION-android-arm64.apk"
          ls -l stage

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: CDCedit-android-arm64
          path: stage/*
          if-no-files-found: error

  windows:
    name: Windows EXE
    needs: validate
    uses: ./.github/workflows/build-app.yml
    with:
      ref: ${{ github.sha }}
      windows_only: true
    secrets: inherit
