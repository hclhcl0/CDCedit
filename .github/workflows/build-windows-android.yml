name: Build CDCedit APK (arm64)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      target:
        description: Platforms to build
        type: choice
        options: [android_arm64, both, windows, android_all]
        default: android_arm64

permissions:
  contents: read
  actions: read

concurrency:
  group: cdcedit-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Check bundled assets
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - run: python3 scripts/ci/check-bundled-assets.py

  android:
    if: ${{ github.event_name == 'push' || inputs.target != 'windows' }}
    name: Android APK (arm64)
    needs: validate
    uses: ./.github/workflows/mobile.yml
    with:
      ref: ${{ github.sha }}
      android_only: true
      arm_only: ${{ github.event_name == 'push' || inputs.target == 'android_arm64' }}
    secrets: inherit

  windows:
    if: ${{ inputs.target == 'both' || inputs.target == 'windows' }}
    name: Windows EXE
    needs: validate
    uses: ./.github/workflows/build-app.yml
    with:
      ref: ${{ github.sha }}
      windows_only: true
    secrets: inherit
